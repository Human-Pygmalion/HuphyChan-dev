observations:
  actor:
    order: [command, projected_gravity, base_ang_vel, joint_pos, joint_vel, previous_action]
    terms:
      - name: command
        slice: [0, 48]
        description: current reference frame, joint_pos[24] followed by joint_vel[24]
        joint_order: &full_joint_order
          - R_hip_pitch_joint
          - R_hip_roll_joint
          - R_hip_yaw_joint
          - R_knee_joint
          - R_crank_A_joint
          - R_rod_A_u1
          - R_rod_A_u2
          - R_crank_B_joint
          - R_rod_B_u1
          - R_rod_B_u2
          - R_ankle_pitch_joint
