      - L_hip_roll_joint
      - L_hip_yaw_joint
      - L_knee_joint
      - L_crank_A_joint
      - L_crank_B_joint
  - name: previous_action
    slice: [30, 42]
    description: previous raw network output before scale, offset, and clipping
  - name: command
    slice: [42, 44]
    fields: [lin_vel_x_mps, ang_vel_z_radps]
    frame: body

