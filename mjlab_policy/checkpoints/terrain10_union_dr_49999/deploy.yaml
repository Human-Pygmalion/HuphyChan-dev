    frame: body
    source: imu_ang_vel
  - name: projected_gravity
    slice: [3, 6]
    frame: body
  - name: motor_pos_history
    slice: [6, 30]
    unit: rad
    relative_to_default: true
    frames: 2
    order: oldest_to_newest
    joint_order: &joint_order
      - R_hip_pitch_joint
      - R_hip_roll_joint
      - R_hip_yaw_joint
      - R_knee_joint
      - R_crank_A_joint
      - R_crank_B_joint
