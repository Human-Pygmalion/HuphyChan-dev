observations:
  actor:
    order: [command, projected_gravity, base_ang_vel, joint_pos, joint_vel, previous_action]
    terms:
      - name: command
        slice: [0, 48]
        description: current reference frame, joint_pos[24] followed by joint_vel[24]
        joint_order: &full_joint_order
          - R_hip_pitch_joint
          - R_hip_roll_joint
          - R_hip_yaw_joint
          - R_knee_joint
          - R_crank_A_joint
          - R_rod_A_u1
          - R_rod_A_u2
          - R_crank_B_joint
          - R_rod_B_u1
          - R_rod_B_u2
          - R_ankle_pitch_joint
          - R_ankle_roll_joint
          - L_hip_pitch_joint
          - L_hip_roll_joint
          - L_hip_yaw_joint
          - L_knee_joint
          - L_crank_A_joint
          - L_rod_A_u1
          - L_rod_A_u2
          - L_crank_B_joint
          - L_rod_B_u1
          - L_rod_B_u2
          - L_ankle_pitch_joint
          - L_ankle_roll_joint
      - name: projected_gravity
        slice: [48, 51]
        frame: body
        training_noise_uniform: [-0.05, 0.05]
        training_delay_policy_steps: [0, 2]
      - name: base_ang_vel
        slice: [51, 54]
        unit: rad/s
        frame: body
        source: imu_ang_vel
        training_noise_uniform: [-0.2, 0.2]
        training_delay_policy_steps: [0, 2]
      - name: joint_pos
        slice: [54, 78]
        unit: rad
        order: *full_joint_order
        relative_to_default: true
        includes_episode_encoder_bias: true
        training_noise_uniform: [-0.01, 0.01]
      - name: joint_vel
        slice: [78, 102]
        unit: rad/s
        order: *full_joint_order
        relative_to_default: true
        training_noise_uniform: [-0.5, 0.5]
      - name: previous_action
        slice: [102, 114]
        description: previous raw network output before scale and default offset; exactly zero on the first frame
    corruption_enabled_during_training: true
    corruption_disabled_in_play_cfg: true
  critic:
    order:
      - command_48
      - motion_anchor_pos_b_3
      - motion_anchor_ori_b_6d_6
      - relative_body_pos_9x3
      - relative_body_ori_9x6d
      - base_lin_vel_3
      - base_ang_vel_3
      - joint_pos_24
      - joint_vel_24
      - previous_action_12
    slices:
      command: [0, 48]
      motion_anchor_pos_b: [48, 51]
      motion_anchor_ori_b: [51, 57]
      body_pos: [57, 84]
      body_ori: [84, 138]
      base_lin_vel: [138, 141]
      base_ang_vel: [141, 144]
      joint_pos: [144, 168]
      joint_vel: [168, 192]
      previous_action: [192, 204]
    tracked_bodies: *tracked_bodies
    corruption_enabled: false

