<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" width="780" height="390" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="780" height="390" fill="#ffffff"/>
  <text x="20" y="22" font-size="15" font-weight="bold" fill="#111">Intel RealSense D455 — 전면도 (카메라를 정면에서 바라본 모습) / Front view, scale 5 px = 1 mm</text>

  <!-- body: 124 x 29 mm -->
  <rect x="70" y="120" width="620" height="145" rx="72.5" ry="72.5" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
  <line x1="40" y1="192.5" x2="720" y2="192.5" stroke="#999" stroke-width="1" stroke-dasharray="10 4 2 4"/>
  <line x1="380" y1="110" x2="380" y2="275" stroke="#999" stroke-width="1" stroke-dasharray="10 4 2 4"/>
  <text x="384" y="284" fill="#666" font-size="11">tripod 1/4-20 centerline (body center)</text>

  <!-- sensors (positions from datasheet Fig 4-8) -->
  <circle cx="142.5" cy="192.5" r="18" fill="#cfe0ff" stroke="#1f4fbf" stroke-width="2.5"/>
  <circle cx="322.5" cy="192.5" r="18" fill="#d6f2d6" stroke="#1d8a1d" stroke-width="2.5"/>
  <rect x="400" y="174.5" width="60" height="36" rx="18" fill="#ffe3c2" stroke="#d9760f" stroke-width="2"/>
  <circle cx="430" cy="192.5" r="10" fill="#fff" stroke="#d9760f" stroke-width="2"/>
  <circle cx="617.5" cy="192.5" r="18" fill="#ffd0d0" stroke="#c21f1f" stroke-width="2.5"/>
  <!-- IMU (behind front plate) -->
  <rect x="460" y="150" width="13" height="11" fill="#e8d6ff" stroke="#7a2fd1" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- labels under sensors -->
  <text x="142.5" y="232" text-anchor="middle" fill="#1f4fbf" font-weight="bold">Right IR</text>
  <text x="322.5" y="232" text-anchor="middle" fill="#1d8a1d" font-weight="bold">RGB</text>
  <text x="430" y="232" text-anchor="middle" fill="#d9760f" font-weight="bold">IR Projector</text>
  <text x="617.5" y="232" text-anchor="middle" fill="#c21f1f" font-weight="bold">Left IR</text>
  <text x="617.5" y="248" text-anchor="middle" fill="#c21f1f" font-size="11">= DEPTH ORIGIN</text>
  <text x="466" y="144" text-anchor="middle" fill="#7a2fd1" font-size="11">IMU (BMI085, 뒤쪽)</text>

  <!-- camera optical axes at Left IR: x right (picture-left), y down, z forward (toward viewer) -->
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c21f1f"/></marker>
  </defs>
  <line x1="617.5" y1="192.5" x2="540" y2="192.5" stroke="#c21f1f" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="528" y="187" text-anchor="end" fill="#c21f1f" font-weight="bold">+x (right)</text>
  <line x1="617.5" y1="192.5" x2="617.5" y2="262" stroke="#c21f1f" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="624" y="270" fill="#c21f1f" font-weight="bold">+y (down)</text>
  <circle cx="650" cy="160" r="9" fill="none" stroke="#c21f1f" stroke-width="2.5"/>
  <circle cx="650" cy="160" r="2.5" fill="#c21f1f"/>
  <text x="664" y="164" fill="#c21f1f" font-weight="bold">+z (forward, 화면 밖으로)</text>

  <!-- dimension rows above -->
  <g stroke="#333" stroke-width="1" fill="none">
    <line x1="142.5" y1="174" x2="142.5" y2="94"/><line x1="617.5" y1="174" x2="617.5" y2="94"/>
    <line x1="142.5" y1="100" x2="617.5" y2="100"/>
    <line x1="322.5" y1="174" x2="322.5" y2="80"/>
    <line x1="322.5" y1="82" x2="617.5" y2="82"/>
    <line x1="430" y1="174" x2="430" y2="62"/>
    <line x1="430" y1="64" x2="617.5" y2="64"/>
    <line x1="466.5" y1="150" x2="466.5" y2="46"/>
    <line x1="466.5" y1="48" x2="617.5" y2="48"/>
  </g>
  <text x="380" y="96" text-anchor="middle" font-weight="bold">95 (baseline)</text>
  <text x="470" y="78" text-anchor="middle">59 (RGB)</text>
  <text x="524" y="60" text-anchor="middle">37.5 (Projector)</text>
  <text x="542" y="44" text-anchor="middle" fill="#7a2fd1">30.22 (IMU)</text>

  <!-- dimension rows below -->
  <g stroke="#333" stroke-width="1" fill="none">
    <line x1="380" y1="290" x2="380" y2="318"/><line x1="617.5" y1="268" x2="617.5" y2="318"/>
    <line x1="380" y1="314" x2="617.5" y2="314"/>
    <line x1="70" y1="268" x2="70" y2="354"/><line x1="690" y1="268" x2="690" y2="354"/>
    <line x1="70" y1="350" x2="690" y2="350"/>
    <line x1="700" y1="120" x2="730" y2="120"/><line x1="700" y1="265" x2="730" y2="265"/>
    <line x1="724" y1="120" x2="724" y2="265"/>
    <line x1="617.5" y1="192.5" x2="740" y2="192.5" stroke="#bbb" stroke-dasharray="3 3"/>
    <line x1="740" y1="192.5" x2="740" y2="155.5" stroke="#7a2fd1"/>
    <line x1="473" y1="155.5" x2="740" y2="155.5" stroke="#7a2fd1" stroke-dasharray="3 3"/>
  </g>
  <text x="500" y="310" text-anchor="middle" font-weight="bold">47.5 (tripod center → Left IR)</text>
  <text x="380" y="346" text-anchor="middle" font-weight="bold">124 (W)</text>
  <text x="728" y="262" fill="#333">29 (H)</text>
  <text x="744" y="176" fill="#7a2fd1" font-size="12">7.4 (IMU ↑)</text>

  <text x="20" y="378" font-size="11" fill="#555">출처: Intel/RealSense D400 Datasheet Rev.017 (Mar 2026) Fig 4-8, Fig 10-12, Table 3-53 수치로 재작도. IMU는 Left IR 기준 우측 30.22 mm, 위쪽 7.4 mm, 후방 16.02 mm.</text>
</svg>
