<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMF Bench</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1c2330; --mute: #5f6b7c; --line: #d9dde4;
    --grid: #e6e9ee; --zero: #9aa4b2;
    --c1: #2a6fdb; --c2: #e07a1f; --c3: #1b9a6a; --c4: #cf3f3f;
    --ok: #1b9a6a; --warn: #d98a00; --bad: #cf3f3f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d; --card: #1b212b; --ink: #e6eaf1; --mute: #93a0b3; --line: #2c3442;
      --grid: #252c38; --zero: #5c6778;
      --c1: #5b97ff; --c2: #f0975a; --c3: #46c796; --c4: #f06b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
           padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line);
          font-size: 12.5px; color: var(--mute); }
  .pill.on { color: #fff; background: var(--ok); border-color: var(--ok); }
  .pill.bad { color: #fff; background: var(--bad); border-color: var(--bad); }
  .pill.warn { color: #fff; background: var(--warn); border-color: var(--warn); }
  .pill.fake { color: var(--warn); border-color: var(--warn); font-weight: 650; }
  main { display: grid; grid-template-columns: 360px 1fr; gap: 12px; padding: 12px 16px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; font-weight: 650; color: var(--mute); letter-spacing: .02em; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--mute); }
  button.primary { background: var(--c1); border-color: var(--c1); color: #fff; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 650; flex: 1 1 100%;
                  padding: 12px; font-size: 16px; }
  button.rec.on { background: var(--bad); color: #fff; border-color: var(--bad); }
  .ctl { margin: 10px 0 0; }
  .ctl label { display: flex; justify-content: space-between; color: var(--mute); font-size: 12.5px; }
  .ctl .row { display: flex; gap: 8px; align-items: center; margin-top: 3px; }
  .ctl input[type=range] { flex: 1; min-width: 0; }
  .ctl input[type=number] { width: 92px; padding: 5px 6px; font: inherit; border: 1px solid var(--line);
                            border-radius: 6px; background: var(--bg); color: var(--ink); }
  .steps { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .steps button { padding: 4px 9px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
  .kv dt { color: var(--mute); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .bad-text { color: var(--bad); font-weight: 650; } .ok-text { color: var(--ok); }
  #msg { min-height: 1.3em; font-size: 12.5px; color: var(--warn); margin-top: 6px; }
  .plot { padding: 8px 10px 6px; }
  .plot .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; font-size: 12.5px; }
  .plot .head b { font-weight: 650; }
  .plot .nums { color: var(--mute); font-variant-numeric: tabular-nums; }
  canvas { width: 100%; height: 150px; display: block; }
  .legend span { margin-right: 12px; } .legend i { display: inline-block; width: 14px; height: 3px;
        vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .hint { color: var(--mute); font-size: 12px; margin-top: 8px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>역기전력 흡수 시험 벤치</h1>
  <span id="hdrModel" class="pill">-</span>
  <span id="pConn" class="pill">연결 안 됨</span>
  <span id="pTorque" class="pill">토크 꺼짐</span>
  <span id="pFault" class="pill">고장 없음</span>
  <span id="pFake" class="pill fake" hidden>시뮬레이션 모터 (실물 아님)</span>
  <span style="flex:1"></span>
  <label class="pill" style="cursor:default">표시 구간
    <select id="winSel">
      <option>5</option><option selected>10</option><option>20</option><option>30</option><option>60</option>
    </select> 초</label>
</header>

<main>
  <div class="stack">
    <section class="card">
      <h2>제어</h2>
      <div class="btnrow">
        <button id="btnConnect" class="primary">연결</button>
        <button id="btnEnable">토크 켜기 (Enable)</button>
        <button id="btnClear">고장 해제</button>
        <button id="btnRecord" class="rec">기록 시작</button>
        <button id="btnDisable" class="danger">끄기 (Disable) — <kbd>Esc</kbd></button>
      </div>
      <div id="msg"></div>

      <div class="ctl">
        <label><span>Kp (위치 이득) [N·m/rad]</span><span id="kpMax"></span></label>
        <div class="row"><input id="kpRange" type="range" min="0" max="100" step="0.5" value="10">
          <input id="kpNum" type="number" min="0" step="0.5" value="10"></div>
      </div>
      <div class="ctl">
        <label><span>Kd (속도 이득) [N·m·s/rad]</span><span id="kdMax"></span></label>
        <div class="row"><input id="kdRange" type="range" min="0" max="10" step="0.05" value="1">
          <input id="kdNum" type="number" min="0" step="0.05" value="1"></div>
      </div>
      <div class="ctl">
        <label><span>목표 위치 [°] (연결 시점 위치 기준)</span><span id="tgtAbs"></span></label>
        <div class="row"><input id="tgtRange" type="range" min="-180" max="180" step="0.5" value="0">
          <input id="tgtNum" type="number" step="0.5" value="0"></div>
        <div class="steps">
          <button data-step="-30">−30°</button><button data-step="-5">−5°</button>
          <button data-step="5">+5°</button><button data-step="30">+30°</button>
          <button id="btnHere">현재 위치로</button>
        </div>
      </div>
      <div class="hint">토크를 켜는 순간 목표는 그때 측정한 위치로 맞춰지므로 튀지 않습니다.</div>
    </section>

    <section class="card">
      <h2>상태</h2>
      <dl class="kv" id="kv"></dl>
    </section>
  </div>

  <div class="stack">
    <section class="card plot">
      <div class="head"><b>① 위치 [°] (연결 시점 위치 = 0)</b>
        <span class="legend"><span><i style="background:var(--c2)"></i>목표</span><span><i style="background:var(--c1)"></i>실제</span></span></div>
      <canvas id="cv0"></canvas>
    </section>
    <section class="card plot">
      <div class="head"><b>② 속도 [°/s]</b><span class="nums" id="n1"></span>
        <span class="legend"><span><i style="background:var(--c1)"></i>속도 (모터 보고값, 표시 한계 ±<b id="vlim">-</b> °/s)</span></span></div>
      <canvas id="cv1"></canvas>
    </section>
    <section class="card plot">
      <div class="head"><b>③ 토크 [N·m] 와 q축 전류 [A]</b><span class="nums" id="n2"></span>
        <span class="legend"><span><i style="background:var(--c1)"></i>토크 (왼쪽 축)</span><span><i style="background:var(--c2)"></i>q축 전류 iqf (오른쪽 축)</span></span></div>
      <canvas id="cv2"></canvas>
    </section>
    <section class="card plot">
      <div class="head"><b>④ 버스 전압 [V]</b><span class="nums" id="n3"></span>
        <span class="legend"><span><i style="background:var(--c3)"></i>VBUS (파라미터 읽기, 약 100 Hz)</span></span></div>
      <canvas id="cv3"></canvas>
    </section>
    <section class="card plot">
      <div class="head"><b>⑤ 되먹임 전력 = 토크 × 속도 [W] (음수 = 전원 쪽으로 되돌림)</b><span class="nums" id="n4"></span></div>
      <canvas id="cv4"></canvas>
    </section>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const FAULT_KO = { overvoltage: "과전압", undervoltage: "저전압", overtemperature: "과온도", stall_overload: "스톨·과부하",
  phase_a_overcurrent: "A상 과전류", phase_b_overcurrent: "B상 과전류", phase_c_overcurrent: "C상 과전류",
  encoder_uncalibrated: "엔코더 미보정", driver_ic: "드라이버 IC", hardware_id: "하드웨어 식별", position_init: "위치 초기화" };
const buf = [];            // samples {t, posRel, tgtRel, vel, tau, iqf, vbus, p, ...}
let S = null;              // latest status
let lastEvent = -1;        // target_event seen
let WIN = 10;
const CSS = () => getComputedStyle(document.documentElement);

// ---------------------------------------------------------------- commands
let msgTimer = null;
function say(text) { $("msg").textContent = text || ""; clearTimeout(msgTimer); if (text) msgTimer = setTimeout(() => $("msg").textContent = "", 8000); }
async function cmd(obj) {
  try {
    const r = await fetch("/cmd", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(obj) });
    const j = await r.json();
    if (j.status) onStatus(j.status);
    if (!j.ok && j.error) say(j.error); else if (j.warning) say(j.warning); else if (j.note) say(j.note);
    return j;
  } catch (e) { say("서버 응답 없음: " + e); }
}
let pending = {}, sendTimer = null;
function sendSet(p) {
  Object.assign(pending, p);
  if (sendTimer) return;
  sendTimer = setTimeout(() => { const q = pending; pending = {}; sendTimer = null; cmd(Object.assign({ action: "set" }, q)); }, 40);
}

// ---------------------------------------------------------------- controls
function bindPair(rangeId, numId, key, clampMax) {
  const r = $(rangeId), n = $(numId);
  r.addEventListener("input", () => { n.value = r.value; sendSet({ [key]: parseFloat(r.value) }); });
  n.addEventListener("input", () => {
    const v = parseFloat(n.value);
    if (!isNaN(v)) { r.value = v; sendSet({ [key]: v }); }
  });
}
bindPair("kpRange", "kpNum", "kp");
bindPair("kdRange", "kdNum", "kd");
bindPair("tgtRange", "tgtNum", "target_deg");
document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
  const v = (parseFloat($("tgtNum").value) || 0) + parseFloat(b.dataset.step);
  $("tgtNum").value = v; $("tgtRange").value = v; sendSet({ target_deg: v });
}));
$("btnHere").addEventListener("click", () => {
  const last = buf[buf.length - 1]; if (!last) return;
  const v = Math.round(last.posRel * 100) / 100;
  $("tgtNum").value = v; $("tgtRange").value = v; sendSet({ target_deg: v });
});
$("btnConnect").addEventListener("click", () => cmd({ action: S && S.connected ? "disconnect" : "connect" }));
$("btnEnable").addEventListener("click", () => cmd({ action: "enable" }));
$("btnDisable").addEventListener("click", () => cmd({ action: "disable" }));
$("btnClear").addEventListener("click", () => cmd({ action: "clear_fault" }));
$("btnRecord").addEventListener("click", () => cmd({ action: "record", record: S && S.recording ? "off" : "on" }));
$("winSel").addEventListener("change", e => { WIN = parseFloat(e.target.value); dirty = true; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { e.preventDefault(); cmd({ action: "disable" }); }
});

// ---------------------------------------------------------------- status
// toFixed that never prints "-0"
const f = (v, d = 1) => { const s = v.toFixed(d); return /^-0(\.0*)?$/.test(s) ? s.slice(1) : s; };
function setPill(el, text, cls) { el.textContent = text; el.className = "pill" + (cls ? " " + cls : ""); }
function onStatus(s) {
  const first = S === null;
  S = s;
  $("hdrModel").textContent = `${s.model} · id ${s.motor_id} · ${s.channel}`;
  $("pFake").hidden = !s.fake;
  setPill($("pConn"), !s.connected ? "연결 안 됨" : s.alive ? "연결됨" : "모터 응답 없음", !s.connected ? "" : s.alive ? "on" : "warn");
  // what the MOTOR reports (mode 2 = Motor) is the truth; our own enable flag is only the request
  if (s.mode === 2) setPill($("pTorque"), "토크 켜짐 (모터 보고)", "bad");
  else if (s.enabled) setPill($("pTorque"), "켜기 명령 중 · 모터는 꺼짐(Reset)", "warn");
  else setPill($("pTorque"), "토크 꺼짐", "");
  setPill($("pFault"), s.fault ? "고장" : s.warn ? "경고" : "고장 없음", s.fault ? "bad" : s.warn ? "warn" : "");
  $("btnConnect").textContent = s.connected ? "연결 해제" : "연결";
  $("btnConnect").className = s.connected ? "" : "primary";
  $("btnRecord").textContent = s.recording ? "기록 중지" : "기록 시작";
  $("btnRecord").classList.toggle("on", s.recording);
  $("kpMax").textContent = `입력 0~${s.kp_max}`; $("kdMax").textContent = `입력 0~${s.kd_max}`;
  $("kpNum").max = s.kp_max; $("kdNum").max = s.kd_max;
  $("vlim").textContent = s.vmax_deg_s.toFixed(0);
  if (s.origin_deg !== null) $("tgtAbs").textContent = `절대 ${(s.origin_deg + s.target_rel_deg).toFixed(1)}°` + (s.target_clamped ? " (범위 초과, 잘림)" : "");
  // server-owned setpoints: first load, and whenever the server moved the target (enable / connect)
  if (first) { setVal("kpNum", "kpRange", s.kp); setVal("kdNum", "kdRange", s.kd); }
  if (s.target_event !== lastEvent) { lastEvent = s.target_event; setVal("tgtNum", "tgtRange", Math.round(s.target_rel_deg * 100) / 100); }
  if (s.message && !$("msg").textContent) $("msg").textContent = s.message;

  const wh = !s.connected ? "-" : "";
  const none = "응답 없음";
  const pct = v => v === null ? "-" : v.toFixed(0) + " %";
  const fault = s.fault ? `<span class="bad-text">있음</span> ` + (s.fault_names.length ? s.fault_names.map(n => FAULT_KO[n] || n).join(", ") : (s.fault_word === null ? "(고장값 조회 중)" : "0x" + s.fault_word.toString(16))) : "없음";
  const rows = [
    ["온도", s.temp_c === null ? "-" : s.temp_c.toFixed(1) + " °C"],
    ["모드", s.mode_name ? `${s.mode_name} (${s.mode})` : "-"],
    ["고장", s.connected ? fault : "-"],
    ["경고 깃발", s.warn ? '<span class="bad-text">켜짐</span> (과전압 접근 등)' : s.connected ? "꺼짐" : "-"],
    ["절대 위치 / 원점", s.pos_deg === null ? "-" : `${s.pos_deg.toFixed(2)}° / ${s.origin_deg === null ? "-" : s.origin_deg.toFixed(2)}°`],
    ["제어 루프", s.connected ? `${s.loop_hz.toFixed(0)} Hz (목표 ${s.rate_hz} Hz) · 최근 1초 최대 간격 ${s.worst_gap_ms.toFixed(1)} ms · 늦은 횟수 ${s.overruns}` : "-"],
    ["잃은 프레임", s.connected ? `상태 ${s.lost_state} · VBUS ${s.lost_vbus} · iqf ${s.lost_iqf} · 송신 실패 ${s.send_fail}` : "-"],
    ["상태 응답률 (2초)", s.connected ? pct(s.state_pct) : "-"],
    ["파라미터 읽기 응답", s.connected ? `VBUS ${s.vbus_ok ? pct(s.vbus_pct) + " (" + s.vbus_hz.toFixed(0) + " Hz)" : '<span class="bad-text">응답 없음</span>'} · iqf ${s.iqf_ok ? pct(s.iqf_pct) + " (" + s.iqf_hz.toFixed(0) + " Hz)" : '<span class="bad-text">응답 없음</span>'}` : "-"],
    ["기록 파일", s.recording ? `${s.rec_file}<br>${s.rec_rows} 행` : (s.rec_file ? `중지됨: ${s.rec_file} (${s.rec_rows} 행)` : "-")],
  ];
  if (s.connected && !s.vbus_ok && !s.iqf_ok) rows.push(["안내", `전압·전류 읽기에 응답이 없습니다. 펌웨어가 ${s.model} ${s.param_fw_min} 이상이어야 합니다 (매뉴얼 Command 14).`]);
  $("kv").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  dirty = true;
}
function setVal(numId, rangeId, v) { $(numId).value = v; $(rangeId).value = v; }

// ---------------------------------------------------------------- plotting
let dirty = true;
function niceStep(span, target) {
  const raw = span / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
}
function range(vals, minSpan) {
  let lo = Infinity, hi = -Infinity;
  for (const v of vals) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (lo === Infinity) { lo = -1; hi = 1; }
  let span = Math.max(hi - lo, minSpan), mid = (hi + lo) / 2;
  if (hi - lo < minSpan) { lo = mid - span / 2; hi = mid + span / 2; }
  const pad = (hi - lo) * 0.08;
  return [lo - pad, hi + pad];
}
function lowerBound(t) { let a = 0, b = buf.length; while (a < b) { const m = (a + b) >> 1; if (buf[m].t < t) a = m + 1; else b = m; } return a; }

// series: [{key, color, axis:'L'|'R', dash, width}], opts: {minSpanL, minSpanR, unitL, unitR, empty}
function draw(cv, series, o) {
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const css = CSS();
  const dual = series.some(s => s.axis === "R");
  const m = { l: 54, r: dual ? 54 : 10, t: 6, b: 20 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const tNow = buf.length ? buf[buf.length - 1].t : 0, t0 = tNow - WIN;
  const i0 = lowerBound(t0), vis = buf.slice(i0);
  const X = t => m.l + (t - t0) / WIN * pw;
  const out = {};
  const axes = {};
  for (const ax of dual ? ["L", "R"] : ["L"]) {
    const vals = [];
    for (const s of series) if ((s.axis || "L") === ax) for (const p of vis) { const v = p[s.key]; if (v !== null && v !== undefined) vals.push(v); }
    axes[ax] = range(vals, ax === "L" ? (o.minSpanL || 1) : (o.minSpanR || 1));
  }
  const Y = (ax, v) => m.t + (1 - (v - axes[ax][0]) / (axes[ax][1] - axes[ax][0])) * ph;
  ctx.font = "11px system-ui, sans-serif";
  ctx.lineWidth = 1;
  // y grid + labels (left axis drives the grid)
  for (const ax of Object.keys(axes)) {
    const [lo, hi] = axes[ax], step = niceStep(hi - lo, 4);
    const dec = step >= 1 ? 0 : Math.min(3, Math.ceil(-Math.log10(step)));
    ctx.fillStyle = css.getPropertyValue("--mute"); ctx.textAlign = ax === "L" ? "right" : "left";
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      const y = Y(ax, v);
      if (ax === "L") { ctx.strokeStyle = Math.abs(v) < step / 1e3 ? css.getPropertyValue("--zero") : css.getPropertyValue("--grid"); ctx.beginPath(); ctx.moveTo(m.l, y); ctx.lineTo(m.l + pw, y); ctx.stroke(); }
      ctx.fillText(f(v, dec), ax === "L" ? m.l - 5 : m.l + pw + 5, y + 3);
    }
  }
  // x grid + labels
  ctx.textAlign = "center"; ctx.fillStyle = css.getPropertyValue("--mute");
  const xs = niceStep(WIN, 5);
  for (let a = 0; a <= WIN + 1e-9; a += xs) { const t = tNow - a, x = X(t); ctx.strokeStyle = css.getPropertyValue("--grid"); ctx.beginPath(); ctx.moveTo(x, m.t); ctx.lineTo(x, m.t + ph); ctx.stroke(); ctx.fillText(a === 0 ? "지금" : `−${a.toFixed(0)} s`, x, H - 5); }
  // series
  ctx.save(); ctx.beginPath(); ctx.rect(m.l, m.t, pw, ph); ctx.clip();
  const stride = Math.max(1, Math.floor(vis.length / (pw * 1.5)));
  for (const s of series) {
    const ax = s.axis || "L";
    ctx.strokeStyle = css.getPropertyValue(s.color); ctx.lineWidth = s.width || 1.6; ctx.setLineDash(s.dash || []);
    ctx.beginPath(); let prev = null, started = false, n = 0;
    for (let k = 0; k < vis.length; k++) {
      const p = vis[k], v = p[s.key];
      if (v === null || v === undefined) continue;
      if (stride > 1 && (n++ % stride)) continue;
      const x = X(p.t), y = Y(ax, v);
      if (!started || (prev !== null && p.t - prev > 0.5)) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      started = true; prev = p.t;
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.setLineDash([]);
  if (o.empty) { ctx.fillStyle = css.getPropertyValue("--bad"); ctx.font = "600 15px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText(o.empty, m.l + pw / 2, m.t + ph / 2); }
  return vis;
}
function stats(vis, key) {
  let lo = Infinity, hi = -Infinity, last = null;
  for (const p of vis) { const v = p[key]; if (v === null || v === undefined) continue; if (v < lo) lo = v; if (v > hi) hi = v; last = v; }
  return lo === Infinity ? null : { lo, hi, last };
}
function render() {
  if (!dirty) return;
  dirty = false;
  const conn = S && S.connected;
  const noConn = conn ? null : "연결 안 됨";
  draw($("cv0"), [{ key: "tgtRel", color: "--c2", dash: [5, 3], width: 1.6 }, { key: "posRel", color: "--c1" }], { minSpanL: 10, empty: noConn });
  const v1 = draw($("cv1"), [{ key: "vel", color: "--c1" }], { minSpanL: 20, empty: noConn });
  const v2 = draw($("cv2"), [{ key: "tau", color: "--c1", axis: "L" }, { key: "iqf", color: "--c2", axis: "R" }],
    { minSpanL: 0.5, minSpanR: 0.5, empty: noConn || (S && !S.iqf_ok ? "iqf 응답 없음 (전류 표시 불가)" : null) });
  const v3 = draw($("cv3"), [{ key: "vbus", color: "--c3" }], { minSpanL: 2, empty: noConn || (S && !S.vbus_ok ? "VBUS 응답 없음" : null) });
  const v4 = draw($("cv4"), [{ key: "p", color: "--c4" }], { minSpanL: 5, empty: noConn });
  const s1 = stats(v1, "vel"); $("n1").textContent = s1 ? `지금 ${f(s1.last,0)} · 최소 ${f(s1.lo,0)} · 최대 ${f(s1.hi,0)}` : "";
  const st = stats(v2, "tau"), si = stats(v2, "iqf");
  $("n2").textContent = (st ? `토크 ${f(st.last,2)} N·m` : "") + (si ? ` · 전류 ${f(si.last,2)} A` : (S && conn ? " · 전류 응답 없음" : ""));
  const sv = stats(v3, "vbus");
  $("n3").innerHTML = sv ? `지금 <b>${sv.last.toFixed(2)}</b> V · 구간 최소 <b>${sv.lo.toFixed(2)}</b> V · 최대 <b>${sv.hi.toFixed(2)}</b> V · 폭 ${(sv.hi - sv.lo).toFixed(2)} V` : (conn ? "응답 없음" : "");
  const sp = stats(v4, "p"); $("n4").textContent = sp ? `지금 ${f(sp.last,1)} W · 구간 최소 ${f(sp.lo,1)} W (되돌림 최대) · 최대 ${f(sp.hi,1)} W` : "";
}
function loop() { render(); requestAnimationFrame(loop); }
window.addEventListener("resize", () => dirty = true);

// ---------------------------------------------------------------- stream
function connectStream() {
  const es = new EventSource("/stream");
  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    const org = d.status.origin_deg || 0;
    for (const r of d.samples) {
      r.posRel = r.pos - org; r.tgtRel = r.tgt - org;
      buf.push(r);
    }
    if (buf.length) { const cut = buf[buf.length - 1].t - 65; let k = 0; while (k < buf.length && buf[k].t < cut) k++; if (k > 0) buf.splice(0, k); }
    onStatus(d.status);
    dirty = true;
  };
  es.onerror = () => { say("스트림이 끊겼습니다. 다시 연결을 시도합니다."); };
}
fetch("/status").then(r => r.json()).then(onStatus).catch(() => {});
connectStream();
requestAnimationFrame(loop);
</script>
